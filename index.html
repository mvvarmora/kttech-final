<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTMTECHNO | Interactive 3D Product</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Jost:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="header-inner">
            <div class="brand">KTMTECHNO</div>
            <div class="subtle">MOVE CURSOR TO EXPLORE</div>
        </div>
    </header>

    <main class="main">
        <div class="product-stage" id="stage">
            <div class="product-orbit" id="orbit">
                <img src="hero.png" class="view" data-angle="0" alt="KTMTECHNO view">
                <img src="product1.png" class="view" data-angle="1" alt="KTMTECHNO view">
                <img src="product2.png" class="view" data-angle="2" alt="KTMTECHNO view">
                <img src="product3.png" class="view" data-angle="3" alt="KTMTECHNO view">
                <img src="product4.png" class="view" data-angle="4" alt="KTMTECHNO view">
            </div>
            <div class="shadow"></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
